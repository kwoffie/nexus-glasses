<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#14264d"/>
      <stop offset="1" stop-color="#050a1a"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <!-- glasses -->
  <g filter="url(#glow)" fill="none" stroke="url(#frame)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <rect x="86" y="196" width="146" height="112" rx="38" fill="url(#lens)"/>
    <rect x="280" y="196" width="146" height="112" rx="38" fill="url(#lens)"/>
    <path d="M232 238 Q256 222 280 238"/>
    <path d="M86 226 L58 214"/>
    <path d="M426 226 L454 214"/>
  </g>
  <!-- HUD details in lens -->
  <g stroke="#e0faff" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M118 236 H170" stroke-width="5"/>
    <path d="M118 256 H146" stroke-width="5" opacity="0.6"/>
    <circle cx="353" cy="252" r="22" stroke-width="5"/>
    <circle cx="353" cy="252" r="6" fill="#e0faff" stroke="none"/>
  </g>
  <!-- lens glints -->
  <path d="M104 214 L130 208" stroke="#fff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M298 214 L324 208" stroke="#fff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <!-- wordmark -->
  <text x="256" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="46" letter-spacing="14" fill="#e0faff">NEXUS</text>
</svg>
